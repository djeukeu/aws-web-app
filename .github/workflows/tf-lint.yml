name: TF Lint
run-name: ${{ github.actor }} triggered the TF lint ci

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!develop'
    paths:
      - 'terraform/**'

jobs:
  lint:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version_file: .tflint-version
      - name: Cache tflint modules
        uses: actions/cache@v6
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}
      - name: TF Lint
        run: |
          tflint